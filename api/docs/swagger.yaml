basePath: /api/v1
definitions:
  response.ErrorResponse:
    properties:
      code:
        description: 错误码
        type: integer
      data:
        description: 错误数据
      msg:
        description: 错误信息
        type: string
    type: object
  response.SuccessResponse:
    properties:
      code:
        description: 成功码
        type: integer
      data:
        description: 成功数据
      msg:
        description: 成功信息
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: jfeng_blog API 文档
  title: jfeng_blog API
  version: "1.0"
paths:
  /user/{id}:
    get:
      consumes:
      - application/json
      description: 根据用户ID获取用户详细信息
      parameters:
      - description: 用户ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 获取用户信息成功
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: 内部服务器错误
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: 根据用户ID获取用户信息
      tags:
      - 用户
schemes:
- http
- https
swagger: "2.0"
